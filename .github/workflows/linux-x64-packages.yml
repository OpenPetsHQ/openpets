name: Build Linux x64 packages

on:
  pull_request:
    paths:
      - ".github/workflows/linux-x64-packages.yml"
      - "apps/desktop/**"
      - "packages/**"
      - "plugins/official/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x64:
    name: Build and smoke-test Linux x64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Record build provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          source_sha="$(git rev-parse HEAD)"
          source_short_sha="$(git rev-parse --short=12 HEAD)"
          lockfile_sha="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          {
            printf 'Source commit: `%s`\n\n' "$source_sha"
            printf 'Lockfile SHA-256: `%s`\n\n' "$lockfile_sha"
            printf 'Workflow run: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_short_sha=%s\n' "$source_short_sha"
            printf 'lockfile_sha=%s\n' "$lockfile_sha"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'Source SHA: %s\n' "$source_sha"
            printf 'Lockfile SHA-256: %s\n' "$lockfile_sha"
            printf 'Workflow run: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
            printf 'Ref: %s\n' "$GITHUB_REF"
            printf 'Version: %s\n' "$version"
          } > diagnostics/provenance.txt

      - name: Install Linux packaging and smoke-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee diagnostics/apt-update.log
          sudo apt-get install --yes \
            rpm cpio squashfs-tools xz-utils xvfb xauth openbox dbus-x11 x11-utils xdotool wmctrl \
            libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
            libc6 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libexpat1 libgbm1 \
            libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 libudev1 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2 libxrender1 libxtst6 \
            2>&1 | tee diagnostics/apt-install.log

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee diagnostics/install.log

      - name: Check desktop
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @open-pets/desktop check 2>&1 | tee diagnostics/desktop-check.log

      - name: Clean package output
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/clean-package-output.cjs 2>&1 | tee diagnostics/clean.log

      - name: Build Linux x64 packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder --linux AppImage deb rpm tar.gz --x64 --publish never \
            2>&1 | tee diagnostics/package-build.log

      - name: Validate Linux x64 packages
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/validate-linux-x64-packages.mjs apps/desktop/dist-electron \
            2>&1 | tee diagnostics/package-validation.log

      - name: Smoke-test Linux x64 DEB
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.provenance.outputs.version }}
        run: |
          set -euo pipefail
          deb_path="apps/desktop/dist-electron/OpenPets-${PACKAGE_VERSION}-linux-amd64.deb"
          bash apps/desktop/scripts/smoke-linux-x64-deb.sh "$deb_path" \
            2>&1 | tee diagnostics/deb-smoke.log

      - name: Write release-candidate build metadata
        id: build-metadata
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.provenance.outputs.version }}
        run: |
          set -euo pipefail
          metadata_path="apps/desktop/dist-electron/BUILD-METADATA.txt"
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          submodule_revisions="$(git submodule status --recursive)"
          {
            printf 'OpenPets Linux x64 release-candidate build metadata\n'
            printf 'Desktop version: %s\n' "$PACKAGE_VERSION"
            printf 'Source SHA: %s\n' "$(git rev-parse HEAD)"
            printf 'Workflow SHA: %s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'Workflow ref: %s\n' "$GITHUB_REF"
            printf 'Workflow run: %s\n' "$workflow_url"
            printf 'Workflow run attempt: %s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'Lockfile SHA-256: %s\n' "$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
            printf 'Node.js version: %s\n' "$(node --version)"
            printf 'pnpm version: %s\n' "$(pnpm --version)"
            printf 'Runner OS: %s\n' "$RUNNER_OS"
            printf 'Runner architecture: %s\n' "$RUNNER_ARCH"
            printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf '\nSubmodule revisions (recursive):\n%s\n' "${submodule_revisions:-none}"
            printf '\nValidation result: all four Linux x64 payloads validated and SHA256SUMS generated.\n'
            printf 'Smoke result: Linux x64 DEB smoke test passed.\n'
          } > "$metadata_path"
          cat "$metadata_path" >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified Linux x64 packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openpets-linux-x64-packages-${{ steps.provenance.outputs.version }}-${{ steps.provenance.outputs.source_short_sha }}-run-${{ github.run_attempt }}
          path: |
            apps/desktop/dist-electron/OpenPets-${{ steps.provenance.outputs.version }}-linux-x86_64.AppImage
            apps/desktop/dist-electron/OpenPets-${{ steps.provenance.outputs.version }}-linux-amd64.deb
            apps/desktop/dist-electron/OpenPets-${{ steps.provenance.outputs.version }}-linux-x86_64.rpm
            apps/desktop/dist-electron/OpenPets-${{ steps.provenance.outputs.version }}-linux-x64.tar.gz
            apps/desktop/dist-electron/SHA256SUMS
            apps/desktop/dist-electron/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openpets-linux-x64-failure-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
